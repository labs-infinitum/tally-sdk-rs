[package]
name = "tallyprime-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/labs-infinitum/tallyprime-sdk"
homepage = "https://github.com/labs-infinitum/tallyprime-sdk"
documentation = "https://docs.rs/tallyprime-sdk"
readme = "README.md"
description = "Rust SDK for TallyPrime XML/HTTP integration with typed APIs for masters, vouchers, and financial reports."
keywords = ["tally", "tallyprime", "accounting", "xml", "erp"]
categories = ["api-bindings", "finance"]
exclude = [".claude/", ".idea/", "tmp/", ".env", ".github/"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
quick-xml = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
regex = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
