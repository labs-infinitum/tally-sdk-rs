name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "How to bump the Cargo.toml version"
        required: true
        type: choice
        options:
          - bugfix
          - minor
          - major
      dry_run:
        description: "Compute the next version without committing or tagging"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Bump version and tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail

          old_version="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"/\1/p' Cargo.toml | head -n1)"
          if [ -z "$old_version" ]; then
            echo "Could not read version from Cargo.toml"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$old_version"

          case "$RELEASE_TYPE" in
            bugfix)
              patch=$((patch + 1))
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            *)
              echo "Unknown release type: $RELEASE_TYPE"
              exit 1
              ;;
          esac

          new_version="${major}.${minor}.${patch}"
          tag="v${new_version}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 1
          fi

          echo "old_version=$old_version" >> "$GITHUB_OUTPUT"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          echo "Current version: $old_version"
          echo "Release type:    $RELEASE_TYPE"
          echo "Next version:    $new_version"
          echo "Tag:             $tag"

      - name: Update Cargo.toml and Cargo.lock
        if: inputs.dry_run != 'true'
        env:
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = \"${OLD_VERSION}\"/s//version = \"${NEW_VERSION}\"/" Cargo.toml
          if grep -q "^name = \"tallyprime-sdk\"$" Cargo.lock; then
            # Update only the root package version entry in the lockfile.
            awk -v new="$NEW_VERSION" '
              BEGIN { in_pkg=0; updated=0 }
              /^\[\[package\]\]$/ { in_pkg=0 }
              /^name = "tallyprime-sdk"$/ { in_pkg=1 }
              in_pkg && /^version = "/ && updated==0 {
                print "version = \"" new "\""
                updated=1
                next
              }
              { print }
            ' Cargo.lock > Cargo.lock.tmp
            mv Cargo.lock.tmp Cargo.lock
          fi
          grep -n '^version = ' Cargo.toml | head -n1
          grep -A2 '^name = "tallyprime-sdk"$' Cargo.lock | head -n3

      - name: Commit, tag, and push
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Branch protection requires verified signatures. Commits created via the
          # GitHub Git Data API are signed by GitHub and satisfy that rule.
          REPO="${GITHUB_REPOSITORY}"
          MESSAGE="Release ${TAG}"

          make_blob() {
            local file="$1"
            jq -n --rawfile content "$file" '{content: $content, encoding: "utf-8"}' \
              | gh api "repos/${REPO}/git/blobs" --input - --jq .sha
          }

          parent_sha="$(gh api "repos/${REPO}/git/ref/heads/${BRANCH}" --jq .object.sha)"
          base_tree_sha="$(gh api "repos/${REPO}/git/commits/${parent_sha}" --jq .tree.sha)"

          toml_sha="$(make_blob Cargo.toml)"
          lock_sha="$(make_blob Cargo.lock)"

          tree_sha="$(
            jq -n \
              --arg base "$base_tree_sha" \
              --arg toml "$toml_sha" \
              --arg lock "$lock_sha" \
              '{
                base_tree: $base,
                tree: [
                  {path: "Cargo.toml", mode: "100644", type: "blob", sha: $toml},
                  {path: "Cargo.lock", mode: "100644", type: "blob", sha: $lock}
                ]
              }' \
              | gh api "repos/${REPO}/git/trees" --input - --jq .sha
          )"

          commit_sha="$(
            jq -n \
              --arg message "$MESSAGE" \
              --arg tree "$tree_sha" \
              --arg parent "$parent_sha" \
              '{message: $message, tree: $tree, parents: [$parent]}' \
              | gh api "repos/${REPO}/git/commits" --input - --jq .sha
          )"

          jq -n --arg sha "$commit_sha" '{sha: $sha}' \
            | gh api "repos/${REPO}/git/refs/heads/${BRANCH}" -X PATCH --input - >/dev/null

          tag_object_sha="$(
            jq -n \
              --arg tag "$TAG" \
              --arg message "$MESSAGE" \
              --arg object "$commit_sha" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                tag: $tag,
                message: $message,
                object: $object,
                type: "commit",
                tagger: {
                  name: "github-actions[bot]",
                  email: "41898282+github-actions[bot]@users.noreply.github.com",
                  date: $date
                }
              }' \
              | gh api "repos/${REPO}/git/tags" --input - --jq .sha
          )"

          gh api "repos/${REPO}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="$tag_object_sha" >/dev/null

          echo "Created verified commit ${commit_sha}"
          echo "Created tag ${TAG} -> ${tag_object_sha}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Create Release"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Current | \`${{ steps.bump.outputs.old_version }}\` |"
            echo "| Type | \`${{ inputs.release_type }}\` |"
            echo "| Next | \`${{ steps.bump.outputs.new_version }}\` |"
            echo "| Tag | \`${{ steps.bump.outputs.tag }}\` |"
            echo "| Dry run | \`${{ inputs.dry_run }}\` |"
            if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ job.status }}" = "success" ]; then
              echo ""
              echo "The **Release** workflow was dispatched to publish \`${{ steps.bump.outputs.tag }}\` to crates.io."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
