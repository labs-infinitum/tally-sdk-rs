name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run instead of publishing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Trusted Publisher on crates.io must list workflow filename: release.yml
    permissions:
      contents: write
      id-token: write # required for crates.io trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$TAG" != "$CRATE_VERSION" ]; then
            echo "Tag version ($TAG) does not match Cargo.toml version ($CRATE_VERSION)"
            exit 1
          fi
          echo "Publishing tallyprime-sdk $CRATE_VERSION"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test (lib)
        run: cargo test --lib --locked

      - name: Check examples
        run: cargo check --examples --locked

      - name: Package dry-run
        run: cargo package --locked

      - name: Publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'
        run: cargo publish --locked --dry-run

      - name: Authenticate with crates.io
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true')
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true')
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

      # cargo package/publish leave verify trees with dangling symlinks that break
      # Swatinem/rust-cache post-job cleanup.
      - name: Remove cargo package artifacts
        if: always()
        run: rm -rf target/package
