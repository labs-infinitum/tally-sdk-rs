[package]
name = "tally-books-skill-cli"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "CLI helpers for the tally-books agent skill (local path SDK)."

[[bin]]
name = "tally-ping"
path = "src/bin/ping.rs"

[[bin]]
name = "tally-ledgers"
path = "src/bin/list_ledgers.rs"

[[bin]]
name = "tally-create-voucher"
path = "src/bin/create_voucher.rs"

[dependencies]
# Relative to this Cargo.toml → repo root (works via ~/.claude/skills symlink too)
tally-sdk-rust = { path = "../../.." }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
